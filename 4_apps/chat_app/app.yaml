command: [
  "streamlit",
  "run",
  "app.py"
]

env:
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
  # Agent Bricks agent app deployed from 3_agent-bricks/agent (`agentbricks deploy`).
  # 4_apps/0_DeployChatApp grants this app's service principal CAN_USE on it.
  - name: AGENT_APP_NAME
    value: agent-bricks-marketing-agent
