<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .stage { fill: #f8f9fa; stroke: #333; stroke-width: 1.5; rx: 10; }
      .s1 { fill: #e8f4fd; stroke: #1e88e5; }
      .s2 { fill: #e8f5e9; stroke: #43a047; }
      .s3 { fill: #fff3e0; stroke: #fb8c00; }
      .s4 { fill: #f3e5f5; stroke: #8e24aa; }
      .title { font-size: 14px; font-weight: 700; fill: #222; }
      .node { fill: #fff; stroke: #666; stroke-width: 1; rx: 6; }
      .label { font-size: 11px; fill: #333; }
      .edge { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- Stage 1 -->
  <rect class="stage s1" x="20" y="20" width="200" height="200"/>
  <text class="title" x="35" y="42">1 - Metric Views</text>
  <rect class="node" x="40" y="55" width="160" height="28"/><text class="label" x="52" y="73">0 Ingest Data</text>
  <rect class="node" x="40" y="90" width="160" height="28"/><text class="label" x="52" y="108">1 Create Metric View</text>
  <rect class="node" x="40" y="125" width="160" height="28"/><text class="label" x="52" y="143">2 Query Metric View</text>
  <rect class="node" x="40" y="160" width="160" height="28"/><text class="label" x="52" y="178">3 Create Dashboard</text>
  <line class="edge" x1="120" y1="83" x2="120" y2="90"/>
  <line class="edge" x1="120" y1="118" x2="120" y2="125"/>
  <line class="edge" x1="120" y1="153" x2="120" y2="160"/>

  <!-- Stage 2 -->
  <rect class="stage s2" x="250" y="20" width="200" height="200"/>
  <text class="title" x="265" y="42">2 - Genie</text>
  <rect class="node" x="270" y="65" width="160" height="28"/><text class="label" x="282" y="83">0 Create Genie Space</text>
  <rect class="node" x="270" y="105" width="160" height="28"/><text class="label" x="282" y="123">1 Query Genie</text>
  <line class="edge" x1="350" y1="93" x2="350" y2="105"/>

  <!-- Stage 3 -->
  <rect class="stage s3" x="480" y="20" width="200" height="260"/>
  <text class="title" x="495" y="42">3 - Agent Bricks</text>
  <rect class="node" x="500" y="55" width="160" height="28"/><text class="label" x="512" y="73">0 Import Contracts</text>
  <rect class="node" x="500" y="90" width="160" height="28"/><text class="label" x="512" y="108">1 Create Vector Search Index</text>
  <rect class="node" x="500" y="125" width="160" height="28"/><text class="label" x="512" y="143">2 Query Vector Search</text>
  <rect class="node" x="500" y="160" width="160" height="28"/><text class="label" x="512" y="178">3 Supervisor Agent</text>
  <rect class="node" x="500" y="195" width="160" height="28"/><text class="label" x="512" y="213">4 Query Supervisor</text>
  <line class="edge" x1="580" y1="83" x2="580" y2="90"/>
  <line class="edge" x1="580" y1="118" x2="580" y2="125"/>
  <line class="edge" x1="580" y1="153" x2="580" y2="160"/>
  <line class="edge" x1="580" y1="188" x2="580" y2="195"/>

  <!-- Stage 4 -->
  <rect class="stage s4" x="710" y="20" width="190" height="100"/>
  <text class="title" x="725" y="42">4 - Apps</text>
  <rect class="node" x="725" y="60" width="160" height="28"/><text class="label" x="737" y="78">0 Deploy Chat App</text>

  <!-- Cross-stage arrows -->
  <path class="edge" d="M 220 174 L 270 79"/>
  <path class="edge" d="M 430 119 L 500 174"/>
  <path class="edge" d="M 660 209 L 725 74"/>

  <!-- Labels -->
  <text class="label" x="225" y="115" fill="#555">metric view</text>
  <text class="label" x="435" y="155" fill="#555">Genie space id</text>
  <text class="label" x="665" y="130" fill="#555">supervisor endpoint</text>
</svg>
