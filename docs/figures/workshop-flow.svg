<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 248" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .stage { fill: #f8f9fa; stroke: #333; stroke-width: 1.5; rx: 10; }
      .s1 { fill: #e8f4fd; stroke: #1e88e5; }
      .s2 { fill: #e8f5e9; stroke: #43a047; }
      .s3 { fill: #fff3e0; stroke: #fb8c00; }
      .s4 { fill: #f3e5f5; stroke: #8e24aa; }
      .title { font-size: 14px; font-weight: 700; fill: #222; }
      .node { fill: #fff; stroke: #666; stroke-width: 1; rx: 6; }
      .label { font-size: 11px; fill: #333; }
      .edge { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- Stage 1 -->
  <rect class="stage s1" x="10" y="10" width="200" height="188"/>
  <text class="title" x="25" y="32">1 - Metric Views</text>
  <rect class="node" x="30" y="45" width="160" height="28"/><text class="label" x="42" y="63">0 Ingest Data</text>
  <rect class="node" x="30" y="78" width="160" height="28"/><text class="label" x="42" y="96">1 Create Metric View</text>
  <rect class="node" x="30" y="111" width="160" height="28"/><text class="label" x="42" y="129">2 Query Metric View</text>
  <rect class="node" x="30" y="144" width="160" height="28"/><text class="label" x="42" y="162">3 Create Dashboard</text>
  <line class="edge" x1="110" y1="73" x2="110" y2="78"/>
  <line class="edge" x1="110" y1="106" x2="110" y2="111"/>
  <line class="edge" x1="110" y1="139" x2="110" y2="144"/>

  <!-- Stage 2 -->
  <rect class="stage s2" x="230" y="10" width="200" height="118"/>
  <text class="title" x="245" y="32">2 - Genie</text>
  <rect class="node" x="250" y="50" width="160" height="28"/><text class="label" x="262" y="68">0 Create Genie Space</text>
  <rect class="node" x="250" y="83" width="160" height="28"/><text class="label" x="262" y="101">1 Query Genie</text>
  <line class="edge" x1="330" y1="78" x2="330" y2="83"/>

  <!-- Stage 3 -->
  <rect class="stage s3" x="450" y="10" width="200" height="223"/>
  <text class="title" x="465" y="32">3 - Agent Bricks</text>
  <rect class="node" x="470" y="45" width="160" height="28"/><text class="label" x="482" y="63">0 Import Contracts</text>
  <rect class="node" x="470" y="78" width="160" height="28"/><text class="label" x="482" y="96">1 Create Vector Search Index</text>
  <rect class="node" x="470" y="111" width="160" height="28"/><text class="label" x="482" y="129">2 Query Vector Search</text>
  <rect class="node" x="470" y="144" width="160" height="28"/><text class="label" x="482" y="162">3 Supervisor Agent</text>
  <rect class="node" x="470" y="177" width="160" height="28"/><text class="label" x="482" y="195">4 Query Supervisor</text>
  <line class="edge" x1="550" y1="73" x2="550" y2="78"/>
  <line class="edge" x1="550" y1="106" x2="550" y2="111"/>
  <line class="edge" x1="550" y1="139" x2="550" y2="144"/>
  <line class="edge" x1="550" y1="172" x2="550" y2="177"/>

  <!-- Stage 4 -->
  <rect class="stage s4" x="670" y="10" width="220" height="78"/>
  <text class="title" x="685" y="32">4 - Apps</text>
  <rect class="node" x="685" y="48" width="190" height="28"/><text class="label" x="692" y="66">0 Deploy Custom Chat App</text>

  <!-- Cross-stage arrows -->
  <path class="edge" d="M 210 158 L 250 64"/>
  <path class="edge" d="M 430 97 L 470 158"/>
  <path class="edge" d="M 630 191 L 685 62"/>

  <!-- Labels -->
  <text class="label" x="212" y="100" fill="#555">metric view</text>
  <text class="label" x="432" y="138" fill="#555">Genie space id</text>
  <text class="label" x="638" y="118" fill="#555">supervisor endpoint</text>
</svg>
